<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Sheet — Server Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#14100c; --panel:#1c1712; --rule:#3a3128; --paper:#e8dcc4;
    --text-dim:#a89a7c; --gold:#b8935a; --jade:#4c7a6c; --seal:#8c2f2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--paper);
    font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:480px; background:var(--panel);
    border:1px solid var(--rule); border-radius:10px; padding:28px 26px;
  }
  h1{margin:0 0 4px; font-size:18px; letter-spacing:.5px;}
  .sub{color:var(--text-dim); font-size:12px; margin-bottom:22px;}
  .status-row{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border:1px solid var(--rule); border-radius:8px; margin-bottom:18px;
    background:rgba(0,0,0,.2); transition:.2s;
  }
  .dot{width:12px; height:12px; border-radius:50%; flex:none; background:var(--seal); box-shadow:0 0 8px var(--seal);}
  .dot.on{background:var(--jade); box-shadow:0 0 8px var(--jade);}
  .status-text{font-size:15px; font-weight:600;}
  .status-text.off{color:#d98a8a;}
  .status-text.on{color:#9fd0bf;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  td{padding:6px 0; border-bottom:1px solid var(--rule); vertical-align:top;}
  td.k{color:var(--text-dim); width:42%; white-space:nowrap;}
  td.v{color:var(--paper); word-break:break-word;}
  tr:last-child td{border-bottom:none;}
  .actions{margin-top:22px; display:flex; gap:10px;}
  button{
    flex:1; padding:10px 14px; border-radius:6px; border:1px solid var(--gold);
    background:transparent; color:var(--gold); font-size:13px; cursor:pointer; transition:.15s;
  }
  button:hover{background:rgba(184,147,90,.12);}
  .footnote{margin-top:16px; font-size:11px; color:var(--text-dim); text-align:center;}
</style>
</head>
<body>
  <div class="card">
    <h1>Local Server Status</h1>
    <div class="sub">This tab stays open and refreshes automatically — leave it running while you play.</div>

    <div class="status-row">
      <div id="dot" class="dot"></div>
      <div id="statusText" class="status-text off">Checking...</div>
    </div>

    <table>
      <tr><td class="k">Server address</td><td class="v">http://localhost:8765</td></tr>
      <tr><td class="k">Serving from</td><td class="v" id="scriptDir">—</td></tr>
      <tr><td class="k">Saves folder</td><td class="v" id="savesDir">—</td></tr>
      <tr><td class="k">Campaign save</td><td class="v" id="saveCount">—</td></tr>
      <tr><td class="k">Diary log</td><td class="v" id="diaryStatus">—</td></tr>
      <tr><td class="k">Uptime</td><td class="v" id="uptime">—</td></tr>
      <tr><td class="k">Last checked</td><td class="v" id="lastChecked">—</td></tr>
    </table>

    <div class="actions">
      <button id="openSheetBtn">Open Character Sheet</button>
    </div>
    <div class="footnote" id="footnote">Polling every 2 seconds...</div>
  </div>

<script>
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const scriptDirEl = document.getElementById('scriptDir');
const savesDirEl = document.getElementById('savesDir');
const saveCountEl = document.getElementById('saveCount');
const diaryStatusEl = document.getElementById('diaryStatus');
const uptimeEl = document.getElementById('uptime');
const lastCheckedEl = document.getElementById('lastChecked');
const footnote = document.getElementById('footnote');

document.getElementById('openSheetBtn').addEventListener('click', ()=>{
  window.open('character_sheet.html', '_blank');
});

function formatUptime(sec){
  if(sec == null) return '—';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = Math.floor(sec%60);
  if(h > 0) return `${h}h ${m}m ${s}s`;
  if(m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function formatTimestamp(iso){
  if(!iso) return 'no entries yet';
  try{
    return new Date(iso).toLocaleString();
  }catch(e){
    return iso;
  }
}

let consecutiveFailures = 0;

async function poll(){
  try{
    const res = await fetch('/api/status', {cache:'no-store'});
    if(!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();

    consecutiveFailures = 0;
    dot.classList.add('on');
    statusText.textContent = 'Server running';
    statusText.classList.remove('off');
    statusText.classList.add('on');

    scriptDirEl.textContent = data.script_dir || '—';
    savesDirEl.textContent = data.saves_dir || '—';
    saveCountEl.textContent = data.current_save_exists
      ? `autosaving — last saved ${formatTimestamp(data.current_save_last_modified)}`
      : (data.legacy_save_count ? `no autosave yet (${data.legacy_save_count} legacy file(s) found)` : 'no save yet');
    diaryStatusEl.textContent = data.diary_exists
      ? `active — last entry ${formatTimestamp(data.diary_last_modified)}`
      : 'not created yet';
    uptimeEl.textContent = formatUptime(data.uptime_seconds);
    footnote.textContent = 'Polling every 2 seconds...';
  }catch(e){
    consecutiveFailures++;
    dot.classList.remove('on');
    statusText.textContent = consecutiveFailures > 1 ? 'Server not responding' : 'Reconnecting...';
    statusText.classList.remove('on');
    statusText.classList.add('off');
    footnote.textContent = 'Can\'t reach the local server -- make sure server.py / launch.py is still running.';
  }
  lastCheckedEl.textContent = new Date().toLocaleTimeString();
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
